<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, S-Class_Hunter!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: #495057;
      background-color: #f1f3f5;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">COMING SOON</span>
    <h1>준비중입니다</h1>
    <p>준비중입니다!</p>
  </main>
</body>
</html>
